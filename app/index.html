<title>Targeting Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: radar console docked under a sticky header; left rail of views (bottom bar on phones); one agency drawer and one chat panel slide in from the right.
   Dark-only "radar" identity: navy-black ground, CivicPlus-style navy surfaces, radar red for live state and Tier 1. */
:root{
  color-scheme:dark;
  --bg:#070B14; --surface:#0D1424; --surface-2:#131C30; --surface-3:#1A2540; --line:#1E2A42; --line-2:#2D3C5C;
  --ink:#E7ECF4; --ink-2:#B6C0D1; --muted:#8794AC;
  --radar:#FF3D3D; --radar-2:#D42A33; --radar-soft:rgba(255,61,61,.13); --radar-glow:rgba(255,61,61,.32);
  --navy:#14284F;
  --fit:#2FC79A; --fit-soft:rgba(47,199,154,.14);
  --friction:#FF8A3D; --friction-soft:rgba(255,138,61,.14);
  --timing:#5B9BFF; --timing-soft:rgba(91,155,255,.15);
  --access:#A6B1C6; --access-soft:rgba(166,177,198,.14);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181;
  --on-solid:#0A0F1C; --danger:#FF7A7A; --focus:#FF6B6B; --shadow:0 18px 50px rgba(0,0,0,.55);
  --f-head:'Space Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-body:'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700;line-height:1.15}
h2{font-size:17px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
a{color:#8FB8FF;text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.11em;text-transform:uppercase;color:var(--radar)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* frame */
.app{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;max-width:1480px;margin:0 auto;padding-block:18px 40px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 18px);align-self:start;display:flex;flex-direction:column;gap:20px;max-height:calc(100vh - 36px);overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px}
.brand svg{width:34px;height:34px;flex:none}
.brand strong{display:block;font:700 17px/1.1 var(--f-head)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;min-height:40px;padding:8px 10px;border:0;border-radius:8px;background:none;color:var(--ink-2);font-weight:500;text-align:left;cursor:pointer}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--surface-2);color:var(--ink);box-shadow:inset 3px 0 0 var(--radar)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .count{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.asklaunch{background:linear-gradient(var(--surface),var(--surface));border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-weight:500;color:var(--ink-2);cursor:pointer;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink);box-shadow:inset 0 -2px 0 var(--radar)}
.scope-select{display:none}
.chipbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;min-height:32px;cursor:pointer;font-weight:500}
.status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-left:auto}
.saveind{font-size:12px} .saveind[data-s="error"]{color:var(--danger)}
.asof-pop{position:absolute;margin-top:6px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:12px;display:flex;gap:8px;align-items:end;z-index:40;flex-wrap:wrap}
.asof-wrap{position:relative}
.badge-demo{background:var(--friction);color:var(--on-solid);font:600 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:5px 9px}
.livechip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 11px;background:var(--radar-soft);color:#FFB3B3;font:600 12px/1 var(--f-mono);border:1px solid rgba(255,61,61,.35);cursor:pointer;min-height:30px}
.livechip i{width:8px;height:8px;border-radius:50%;background:var(--radar);box-shadow:0 0 0 0 var(--radar-glow);animation:pulse 1.6s infinite}
#view{padding-block:18px 8px;display:flex;flex-direction:column;gap:20px;outline:none}
.viewhead{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:end;justify-content:space-between}
.note{background:var(--surface);border:1px dashed var(--line-2);border-radius:12px;padding:12px 14px;color:var(--ink-2)}
.note.warn{border-color:var(--radar);border-style:solid;background:var(--radar-soft)}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;max-width:100%}
.card h2,.card h3{margin-bottom:10px}
.cardhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 10px;margin-bottom:10px}
.cardhead h2,.cardhead h3{margin:0}
.cardq{color:var(--muted);font-size:12.5px;margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:7px 13px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--radar);border-color:var(--radar);color:var(--on-solid);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.scan{border-color:rgba(255,61,61,.55);color:#FFC2C2;background:var(--radar-soft)}
.btn.scan svg,.btn.ask svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.btn.warn{border-color:var(--radar);color:#FFB3B3}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{border:0;background:none;padding:0;color:#8FB8FF;cursor:pointer;text-decoration:underline;text-underline-offset:2px;font:inherit}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.chip{justify-self:start;display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:500;line-height:1.35;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.chip.fit{background:var(--fit-soft);color:#7FE3C3}
.chip.fr{background:var(--friction-soft);color:#FFB98A}
.chip.tm{background:var(--timing-soft);color:#A9C8FF}
.chip.ac{background:var(--access-soft);color:var(--ink-2)}
.chip.rd{background:var(--radar-soft);color:#FFB3B3}
.chip.dash{background:none;border:1px dashed var(--line-2)}
.chip.wrap{white-space:normal}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.tier{justify-self:start;display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font:600 12px/1.35 var(--f-body);white-space:nowrap}
.tier.t1{background:var(--radar);color:var(--on-solid)}
.tier.t1p{background:var(--radar-soft);color:#FFB3B3;box-shadow:inset 0 0 0 1px var(--radar)}
.tier.t1d{background:none;color:#FFB3B3;outline:1.5px dashed var(--radar);outline-offset:-1.5px}
.tier.t2{background:var(--timing-soft);color:#A9C8FF}
.tier.t3{background:var(--surface-3);color:var(--ink-2)}
.tier.sa{background:#2A3550;color:var(--ink-2)}
.tier.un{background:none;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-2)}
.tv{color:#FFB98A;font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:6px 9px;min-height:34px;max-width:100%;color:var(--ink)}
textarea{width:100%;min-height:72px;resize:vertical}
label{font-weight:500}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field .hint{font-size:12px;color:var(--muted);font-weight:400}
.formrow{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.segbar{display:flex;gap:2px;height:20px;border-radius:5px;overflow:hidden;min-width:120px;flex:1}
.segbar span{display:flex;align-items:center;justify-content:center;font:600 11px/1 var(--f-mono);color:var(--on-solid);overflow:hidden;white-space:nowrap}
.segbar span:last-child{flex:1;background:var(--surface-3)}
.segbar .s-fit{background:var(--fit);flex:none} .segbar .s-fr{background:var(--friction);flex:none} .segbar .s-tm{background:var(--timing);flex:none} .segbar .s-ac{background:var(--access);flex:none}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* scan console + radar */
.console{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;background:radial-gradient(120% 140% at 0% 50%, rgba(255,61,61,.10), transparent 55%), var(--surface);border:1px solid rgba(255,61,61,.35);border-radius:16px;padding:16px 18px;box-shadow:0 0 0 1px rgba(255,61,61,.06), 0 10px 40px rgba(255,61,61,.07)}
.radar-wrap{width:200px;height:200px;position:relative}
.radar-wrap canvas{width:200px;height:200px;display:block}
.console h2{font-size:19px;margin:4px 0 10px}
.pbar{height:12px;border-radius:7px;background:var(--surface-3);overflow:hidden;position:relative}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--radar-2),var(--radar));box-shadow:0 0 12px var(--radar-glow);transition:width .6s ease}
.pmeta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-top:8px;color:var(--ink-2);font-size:12.5px}
.pmeta b{font:700 22px/1 var(--f-mono);color:var(--ink)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;padding:0;list-style:none}
.steps li{font-size:12px;border-radius:999px;padding:3px 10px;background:var(--surface-3);color:var(--muted)}
.steps li.done{background:var(--radar-soft);color:#FFB3B3}
.steps li.now{color:var(--ink);box-shadow:inset 0 0 0 1px var(--radar)}
.scanbar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;background:var(--surface);border:1px solid rgba(255,61,61,.35);border-radius:14px;padding:12px 16px}
.scanbar svg{width:34px;height:34px;flex:none}
.scanbar p{flex:1;min-width:240px;color:var(--ink-2)}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--radar-glow)}70%{box-shadow:0 0 0 9px rgba(255,61,61,0)}100%{box-shadow:0 0 0 0 rgba(255,61,61,0)}}

/* charts */
.fn{display:flex;flex-direction:column;gap:4px}
.fn-row{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:12px;align-items:center;border:0;background:none;color:inherit;text-align:left;padding:6px 4px;border-radius:8px;cursor:pointer;min-height:44px}
.fn-row:hover{background:var(--surface-2)}
.fn-l{display:flex;flex-direction:column;font-weight:600;line-height:1.2}
.fn-l small{font-weight:400;color:var(--muted);font-size:11.5px}
.fn-track{height:24px;display:flex;justify-content:center;align-items:center}
.fn-track i{display:block;height:100%;border-radius:4px;min-width:3px}
.fn-n{font:700 20px/1 var(--f-mono);text-align:right}
.fn-drop{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px 2px calc(150px + 16px)}
.fn-drop button{border:0;background:none;color:var(--muted);font-size:12px;padding:2px 0;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;min-height:24px}
.fn-drop button:hover{color:var(--ink)}
.strip{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) 108px;gap:10px;align-items:center}
.strack{position:relative;height:30px;border-radius:6px;background:var(--surface-2)}
.strack .tl{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed var(--line-2)}
.strack .tl.t1line{border-left-color:rgba(255,61,61,.7)}
.sdot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:0 0 0 2px var(--surface-2)}
.sdot:hover,.sdot:focus-visible{transform:scale(1.6);z-index:2}
.sdot.t1{background:var(--radar)} .sdot.t1p,.sdot.t1d{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--radar),0 0 0 2px var(--surface-2)}
.sdot.t2{background:var(--timing)} .sdot.t3{background:#5B6782}
.saxis{display:grid;grid-template-columns:44px minmax(0,1fr) 108px;gap:10px;font:11px var(--f-mono);color:var(--muted)}
.saxis div{position:relative;height:14px}
.saxis div span{position:absolute;transform:translateX(-50%)}
.stack{display:flex;gap:2px;height:22px;border-radius:5px;overflow:hidden}
.stack button{border:0;padding:0;display:flex;align-items:center;justify-content:center;font:600 11px/1 var(--f-mono);color:var(--on-solid);cursor:pointer;min-width:3px}
.stack button:hover{filter:brightness(1.15)}
.stack .s-pdf_form{background:var(--c1)} .stack .s-phone_email{background:var(--c2)} .stack .s-none_found{background:var(--c3)} .stack .s-online_legacy{background:var(--c4)} .stack .s-online_modern{background:var(--c5)}
.stack .s-unknown{background:repeating-linear-gradient(45deg,#3A4766 0 4px,#2C3852 4px 8px);color:var(--ink-2)}
.tlc{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:150px;padding-top:18px}
.tlc button{position:relative;border:0;background:none;padding:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;cursor:pointer;color:inherit}
.tlc button i{display:block;background:var(--timing);border-radius:4px 4px 0 0;min-height:2px}
.tlc button.now i{background:var(--radar)}
.tlc button b{position:absolute;left:0;right:0;text-align:center;font:600 11px/1 var(--f-mono);color:var(--ink-2)}
.tlc button:hover i{filter:brightness(1.2)}
.tlx{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;margin-top:6px;font:11px var(--f-mono);color:var(--muted);text-align:center}
#tip{position:fixed;z-index:70;pointer-events:none;background:var(--surface-3);border:1px solid var(--line-2);color:var(--ink);font-size:12.5px;padding:7px 10px;border-radius:8px;box-shadow:var(--shadow);max-width:280px;white-space:pre-line}

/* lists */
.mini{display:flex;flex-direction:column}
.mini button.r{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 2px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;min-height:44px;color:inherit}
.mini button.r:first-child{border-top:0}
.mini button.r:hover{background:var(--surface-2)}
.mini .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.stat{display:flex;flex-direction:column;gap:2px;align-items:flex-start;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;cursor:pointer;min-width:0;color:inherit}
.stat b{font:700 22px/1.1 var(--f-mono)}
.stat span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n,table.t th.n{text-align:right}
table.t button.cell{border:0;background:none;color:#8FB8FF;cursor:pointer;font:inherit;text-decoration:underline;text-underline-offset:2px;padding:0;min-height:28px}

/* universe */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.filters .field{min-width:120px}
.saved{display:flex;flex-wrap:wrap;gap:6px}
.saved button{border:1px solid var(--line-2);background:var(--surface-2);border-radius:999px;padding:5px 11px;min-height:32px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.saved button[aria-pressed="true"]{background:var(--radar);color:var(--on-solid);border-color:var(--radar)}
.ulist{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.uhead,.urow{display:grid;grid-template-columns:34px minmax(180px,2.2fr) 48px minmax(84px,1fr) minmax(84px,1fr) 78px minmax(96px,1fr) 88px minmax(110px,1.1fr) minmax(104px,1.1fr) 72px;align-items:center;gap:8px;padding:0 12px}
.uhead{height:40px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.uhead button{border:0;background:none;font:600 11px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);cursor:pointer;text-align:left;padding:0;min-height:30px}
.uhead button[aria-sort="ascending"]::after{content:" \2191"} .uhead button[aria-sort="descending"]::after{content:" \2193"}
.uscroll{height:min(64vh,640px);overflow:auto;position:relative}
.urow{position:absolute;left:0;right:0;height:52px;border-bottom:1px solid var(--line);cursor:pointer}
.urow:hover,.urow:focus-visible{background:var(--surface-2)}
.urow .nm{min-width:0}
.urow .nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urow .nm small{display:none;color:var(--muted);font-size:12px}
.urow>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.urow input,.uhead input{width:18px;height:18px;accent-color:var(--radar)}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface-3);border:1px solid var(--line-2);border-radius:12px;padding:8px 12px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* scorecard */
.sc{display:grid;grid-template-columns:250px minmax(0,1fr) 260px;gap:16px;align-items:start}
.sc.how-closed{grid-template-columns:250px minmax(0,1fr) 150px}
.slider{display:grid;grid-template-columns:72px minmax(0,1fr) 34px;gap:8px;align-items:center;min-height:36px}
.slider input{width:100%;accent-color:var(--radar)}
.slider .v{text-align:right;font:600 13px var(--f-mono)}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px}
.rank{display:flex;flex-direction:column}
.rank-h{display:grid;grid-template-columns:26px 36px minmax(150px,1.7fr) minmax(120px,1.2fr) 30px 40px 108px;gap:10px;padding:0 6px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}

const CSV_COLS = ['agency','state','type','population','relationship','tier','readiness','priority','top_signals','friction_summary','budget_window','evidence_urls','verified','agency_id','website','priority_unit'];
function csvFor(ds) {
  const q = v => { const s = v == null ? '' : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [CSV_COLS.join(',')];
  for (const d of ds) {
    const a = d.a;
    const urls = new Set();
    for (const e of (a.evidence || [])) if (e.url) urls.add(e.url);
    for (const s of d.live) if (s.sourceUrl) urls.add(s.sourceUrl);
    if (d.bud && d.bud.sourceUrl && d.bud.basis === 'verified') urls.add(d.bud.sourceUrl);
    lines.push([a.name, a.state, TYPE_LABEL[a.type] || a.type, a.population ?? '', relChip(d), TIER_LABEL[d.tier], Math.round(d.R),
      S.pricingDollars ? Math.round(d.priority) : Math.round(d.priority), d.live.slice(0, 3).map(s => `${SIGNAL_LABEL[s.type] || s.type} (${s.date})`).join('; '),
      frictionChips(d).join('; '), budgetChip(d), [...urls].join(' '), d.keyVerified ? `yes (${d.dec.verifiedOn})` : 'no', a.id, a.website || '',
      S.pricingDollars ? 'usd' : 'relative'].map(q).join(','));
  }
  return lines.join('\r\n');
}
async function exportCSV(ds, label) {
  if (!ds.length) { toast('Nothing to export in this selection.'); return; }
  const name = `${demoOn() ? 'DEMO-' : ''}targeting-studio-${label}-${S.asOf}.csv`;
  const data = csvFor(ds);
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch { dl = null; }
  if (dl) {
    try { await dl.save({filename:name, data}); toast(`Exported ${fmtN(ds.length)} rows to ${name}.`); return; }
    catch (e) { if (e && e.code === 'declined') return; if (e && e.code === 'rate_limited') { toast('A save prompt is already open.'); return; } }
  }
  S.csvFallback = {name, data, n:ds.length}; render();
}

  if (t.id === 'u-q') { clearTimeout(Q_T); Q_T = setTimeout(() => { S.uni.q = t.value; ss.set('uni', S.uni); UNI_LIST = uniFiltered(); const c = $('#u-count'); if (c) c.textContent = `${fmtN(UNI_LIST.length)} agencies`; const sc = $('#uscroll'); if (sc) { sc.scrollTop = 0; sc.innerHTML = UNI_LIST.length ? `<div id="uspacer" style="height:${UNI_LIST.length * ROW_H}px;position:relative"></div>` : '<div class="empty">No agencies match these filters.</div>'; renderUniverseRows(); } }, 140); return; }
  if (t.id === 'cyc-q') { S.cycleQ = t.value; clearTimeout(Q_T); Q_T = setTimeout(() => renderView(), 140); return; }
});
const TIP = () => document.getElementById('tip');
document.addEventListener('mouseover', e => {
  const t = e.target.closest && e.target.closest('[data-tip]'); const tip = TIP(); if (!tip) return;
  if (!t) { tip.hidden = true; return; }
  tip.textContent = t.dataset.tip; tip.hidden = false;
  const r = t.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = clamp(r.left + r.width / 2 - w / 2, 8, window.innerWidth - w - 8) + 'px';
  tip.style.top = (r.top - h - 8 < 8 ? r.bottom + 8 : r.top - h - 8) + 'px';
});
document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('[data-tip]'); const tip = TIP(); if (tip && !t) tip.hidden = true; });
document.addEventListener('scroll', () => { const tip = TIP(); if (tip) tip.hidden = true; }, {passive:true, capture:true});
document.addEventListener('scroll', e => { if (e.target && e.target.id === 'uscroll') { UNI_SCROLL = e.target.scrollTop; renderUniverseRows(); } }, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && e.target && e.target.id === 'chat-in') { e.preventDefault(); const f = e.target.form; if (f) f.requestSubmit(); return; }
  if (e.key === 'Escape') {
    if (S.asOfOpen) { S.asOfOpen = false; renderTop(); return; }
    if (S.chat.open && !S.drawer) { S.chat.open = false; renderChat(); renderTop(); return; }
    if (S.drawer) { if (S.drawerMode) { S.drawerMode = null; renderDrawer(); } else closeDrawer(); return; }
    if (S.rowEdit) { S.rowEdit = null; renderView(); return; }
    return;
  }
  const t = e.target;
  if (t.classList && t.classList.contains('urow')) {
    const i = +t.dataset.idx;
    if (e.key === 'Enter' || e.key === ' ') { if (e.target.tagName !== 'INPUT') { e.preventDefault(); openDrawer(t.dataset.id); } return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); const n = clamp(i + (e.key === 'ArrowDown' ? 1 : -1), 0, UNI_LIST.length - 1); S.uniFocus = n;
      const sc = $('#uscroll'); if (n * ROW_H < sc.scrollTop) sc.scrollTop = n * ROW_H; else if ((n + 1) * ROW_H > sc.scrollTop + sc.clientHeight) sc.scrollTop = (n + 1) * ROW_H - sc.clientHeight;
      renderUniverseRows(); const el = $(`.urow[data-idx="${n}"]`); if (el) el.focus(); return;
    }
  }
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && t.closest && t.closest('[data-list]')) {
    const list = t.closest('[data-list]'); const rows = [...list.querySelectorAll('[data-row]')]; const cur = t.closest('[data-row]'); const i = rows.indexOf(cur);
    if (i < 0) return; e.preventDefault(); const n = rows[clamp(i + (e.key === 'ArrowDown' ? 1 : -1), 0, rows.length - 1)]; n.focus();
    return;
  }
  if (e.key === 'Enter' && t.matches && t.matches('article[data-row]')) { openDrawer(t.dataset.id); }
});
document.addEventListener('click', e => {
  const row = e.target.closest('.urow');
  if (row && !e.target.closest('input')) { S.uniFocus = +row.dataset.idx; openDrawer(row.dataset.id); }
});

/* =========================================================
   Boot
   ========================================================= */
if (!['funnel','universe','scorecard','calendar','shortlist','aside','settings'].includes(S.view)) S.view = 'funnel';
if (!['ALL', ...STATES].includes(S.scope)) S.scope = 'ALL';
ensureRows();
recompute();
render();
connect();
})();
</script>
